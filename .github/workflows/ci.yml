name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  verify-endpoints:
    name: Verify FMP endpoints against the live API
    runs-on: ubuntu-latest
    # Forked pull requests cannot read repository secrets, so skip rather than
    # fail with a misleading "key not set".
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every endpoint the valuation engine depends on
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
        run: node scripts/verify-endpoints.mjs
